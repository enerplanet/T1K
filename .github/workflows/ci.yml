name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          # Pinned: a floating "latest" can start failing on rule changes
          # unrelated to the code under review. Bump deliberately.
          version: v2.13.2

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test (race, shuffled)
        run: go test -race -shuffle=on ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath ./cmd/t1k
      - name: Convert the example both ways
        run: |
          ./t1k -in examples/enerplanet-calculation.json -out meme.json
          ./t1k -reverse -in meme.json -out back.json
          test -s meme.json && test -s back.json

  environment:
    name: environment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the environment image
        run: make -C environment build ENV=test
      - name: Race tests and lint inside the image
        run: make -C environment check ENV=test

  vuln:
    name: vuln
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...
